services:
  - type: web
    name: claxic-platform
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: PORT
        value: 10000
    disk:
      name: claxic-data
      mountPath: /app/backend/db
      sizeGB: 1
