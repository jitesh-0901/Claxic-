services:
  claxic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claxic-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - SERVE_FRONTEND=true
      - PORT=5000
      # Razorpay payment keys (optional)
      # - RAZORPAY_KEY_ID=your_key_id
      # - RAZORPAY_KEY_SECRET=your_secret_key
    volumes:
      # Persistent storage for SQLite database (claxic.db)
      - ./backend/db:/app/backend/db
      # Persistent storage for video uploads and attachments
      - ./uploads:/app/uploads
